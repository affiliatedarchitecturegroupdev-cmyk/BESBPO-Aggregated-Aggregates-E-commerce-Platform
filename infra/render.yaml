# Render deployment blueprint — matches the Roofsteel/Bricksplaza hosting pattern.
# Database and Redis are managed externally (Supabase, Upstash) per the confirmed
# architecture, so no Render-managed Postgres/Redis instances are declared here.

services:
  - type: web
    name: aggregates-store-web
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter web build
    startCommand: pnpm --filter web start
    domains:
      - aggregates.store
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        value: https://aggregates.store
      - key: NEXT_PUBLIC_APP_URL
        value: https://app.aggregates.store
      - key: PRICING_SERVICE_URL
        fromService:
          type: web
          name: aggregates-store-pricing
          property: host

  - type: web
    name: aggregates-store-api
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter api build
    startCommand: pnpm --filter api start:prod
    domains:
      - app.aggregates.store
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AUTH_SECRET
        sync: false

  - type: web
    name: aggregates-store-pricing
    runtime: python
    plan: starter
    buildCommand: pip install -r services/pricing/requirements.txt
    startCommand: uvicorn services.pricing.main:app --host 0.0.0.0 --port $PORT
