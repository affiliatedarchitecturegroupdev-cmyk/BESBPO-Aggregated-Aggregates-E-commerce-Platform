# Tests on every push and pull request (docs/uptime.md): the pricing service,
# the API's unit and end-to-end tests against a real Postgres, and a type
# check and production build of the storefront. No secrets are needed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pricing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pricing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pricing/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aggregates
          POSTGRES_PASSWORD: aggregates
          POSTGRES_DB: aggregates_store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aggregates"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://aggregates:aggregates@localhost:5432/aggregates_store
      DIRECT_URL: postgresql://aggregates:aggregates@localhost:5432/aggregates_store
      PRICING_SERVICE_URL: http://localhost:8000
      # Background jobs stay off in tests.
      BOOKINGS_SCHEDULER: "off"
      INSIGHTS_DIGEST: "off"
      LISTMONK_SYNC: "off"
      PAYMENTS_SYNC: "off"
      UPTIME_MONITOR: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pricing/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install -r services/pricing/requirements.txt
      - name: Start the pricing service
        working-directory: services/pricing
        run: |
          nohup python -m uvicorn main:app --port 8000 > /tmp/pricing.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Migrate and seed the database
        run: pnpm db:generate && pnpm --filter @aggregates/database exec prisma migrate deploy && pnpm db:seed
      - run: pnpm --filter api build
      - name: Seed partner suppliers
        working-directory: apps/api
        run: node dist/suppliers/seed-suppliers.js
      - name: Unit tests
        working-directory: apps/api
        run: npx jest
      - name: End-to-end tests
        working-directory: apps/api
        run: npx jest --config test/jest-e2e.json --runInBand --forceExit

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: apps/web
        run: npx tsc --noEmit -p tsconfig.json
      - name: Production build
        run: pnpm --filter web build
