# Render Blueprint — Aggregated Aggregates platform.
#
# Services, matching the Roofsteel/Bricksplaza hosting pattern:
#   aggregates-store-web      Next.js storefront          (public)
#   aggregates-store-api      NestJS API + DB migrations  (public)
#   aggregates-store-pricing  FastAPI pricing service     (private — reachable only by the API)
#   aggregates-listmonk       Listmonk newsletters        (public admin UI, its own small Postgres)
#
# The database is Supabase Postgres (confirmed architecture), not a
# Render-managed instance: Render asks for DATABASE_URL and DIRECT_URL when
# the Blueprint is created. Redis (Upstash) is not wired into any service yet,
# so it is not requested here.
#
# Live domain: aaggregates.store (registered at GoDaddy, DNS on Cloudflare),
# added as a custom domain on the web service in the Render dashboard.
# NEXT_PUBLIC_SITE_URL tells both services the public address.
# See docs/deployment/render.md for the full walkthrough.

services:
  - type: web
    name: aggregates-store-web
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npx --yes pnpm@9.9.0 install --frozen-lockfile && npx --yes pnpm@9.9.0 run build:web
    startCommand: cd apps/web && node_modules/.bin/next start -p $PORT
    healthCheckPath: /
    buildFilter:
      paths:
        - apps/web/**
        - content/**
        - package.json
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Account pages and server actions call the API over the private network;
      # the browser never talks to the API directly.
      - key: API_URL
        fromService:
          type: web
          name: aggregates-store-api
          property: hostport
      # Canonical links, the sitemap and structured data. Inlined at build time.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://aaggregates.store

  - type: web
    name: aggregates-store-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npx --yes pnpm@9.9.0 install --frozen-lockfile && npx --yes pnpm@9.9.0 run build:api
    # Applies Prisma migrations, syncs the catalogue, price bands, tiers and
    # delivery bands from the pricing workbooks, then adds any supplier from
    # the seed-data CSVs not yet in the database (all idempotent; staff edits
    # to existing suppliers are never overwritten).
    preDeployCommand: npx --yes pnpm@9.9.0 run db:deploy && node apps/api/dist/suppliers/seed-suppliers.js && node apps/api/dist/merchandising/seed-product-images.js
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/v1/health
    buildFilter:
      paths:
        - apps/api/**
        - packages/database/**
        - services/pricing/data/**
        - package.json
        - pnpm-lock.yaml
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: PRICING_SERVICE_URL
        fromService:
          type: pserv
          name: aggregates-store-pricing
          property: hostport
      - key: AUTH_SECRET
        generateValue: true
      # Payment return links, links in emails and WhatsApp messages, the
      # catalogue feed and the allowed browser origin.
      - key: NEXT_PUBLIC_SITE_URL
        value: https://aaggregates.store
      # PayFast (docs/payments-payfast.md). Prefixed AGG_ because the owner
      # runs several stores; MODE is "live" or "sandbox" (anything else is
      # treated as sandbox).
      - key: AGG_PAYFAST_MERCHANT_ID
        sync: false
      - key: AGG_PAYFAST_MERCHANT_KEY
        sync: false
      - key: AGG_PAYFAST_PASSPHRASE
        sync: false
      - key: AGG_PAYFAST_MODE
        sync: false
      # Compliance documents live in a private Supabase Storage bucket; the API
      # serves them, applying each document's visibility rules.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: STORAGE_BUCKET
        value: compliance-documents
      # Transactional email (docs/notifications.md). Until these are set,
      # messages are logged in Admin -> Notifications and can be resent later.
      # Tax invoices (Admin -> Orders): refused until both are set — see render.md.
      - key: GROUP_VAT_NUMBER
        sync: false
      - key: PRICES_INCLUDE_VAT
        sync: false
      - key: EFT_BANKING_DETAILS
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # Resend's delivery webhook signing secret (whsec_…): bounces and spam
      # complaints stop further email to that address (docs/email.md).
      - key: RESEND_WEBHOOK_SECRET
        sync: false
      # Listmonk newsletters (docs/email.md). Confirmed subscribers are pushed
      # over the private network; unsubscribes sync both ways every hour.
      - key: LISTMONK_URL
        fromService:
          type: web
          name: aggregates-listmonk
          property: hostport
      - key: LISTMONK_API_USER
        sync: false
      - key: LISTMONK_API_TOKEN
        sync: false
      - key: LISTMONK_LIST_IDS
        sync: false
      # Sign-in providers (docs/sign-in.md). Each button stays "coming soon"
      # until its client ID and secret are set.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: X_CLIENT_ID
        sync: false
      - key: X_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false

  - type: pserv
    name: aggregates-store-pricing
    runtime: python
    region: frankfurt
    plan: starter
    rootDir: services/pricing
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"

  # Listmonk — newsletters and campaigns (docs/email.md). The official image,
  # pinned; it installs its tables on first start and upgrades them on later
  # ones. Campaign email goes out through Resend's SMTP, set in Listmonk's own
  # Settings → SMTP (never in this file).
  - type: web
    name: aggregates-listmonk
    runtime: image
    image:
      url: docker.io/listmonk/listmonk:v4.1.0
    region: frankfurt
    plan: starter
    dockerCommand: sh -c "./listmonk --install --idempotent --yes --config '' && ./listmonk --upgrade --yes --config '' && ./listmonk --config ''"
    healthCheckPath: /health
    envVars:
      - key: LISTMONK_app__address
        value: 0.0.0.0:10000
      - key: PORT
        value: "10000"
      - key: LISTMONK_db__host
        fromDatabase:
          name: aggregates-listmonk-db
          property: host
      - key: LISTMONK_db__port
        fromDatabase:
          name: aggregates-listmonk-db
          property: port
      - key: LISTMONK_db__user
        fromDatabase:
          name: aggregates-listmonk-db
          property: user
      - key: LISTMONK_db__password
        fromDatabase:
          name: aggregates-listmonk-db
          property: password
      - key: LISTMONK_db__database
        fromDatabase:
          name: aggregates-listmonk-db
          property: database
      - key: LISTMONK_db__ssl_mode
        value: disable
      # The first admin login, used only when Listmonk installs itself.
      - key: LISTMONK_ADMIN_USER
        sync: false
      - key: LISTMONK_ADMIN_PASSWORD
        sync: false

databases:
  - name: aggregates-listmonk-db
    region: frankfurt
    plan: basic-256mb
    databaseName: listmonk
    user: listmonk
